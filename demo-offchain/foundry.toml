# Isolated Foundry project. The official BLADE Core is the sibling clone at
# ../../blade, pinned to the E2 commit 4b60b86159e89baccd24a859ca62e7039a8c8be2.
# This project never copies or patches Core sources.

[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = []
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
allow_paths = ["../../blade"]
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 100
